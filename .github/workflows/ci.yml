name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-bin
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
